name: Build Native Muzammil Online Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # 1. Find Native PC Project ZIP
      - name: Find Native PC ZIP
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path . -Recurse `
            -Filter "Muzammil_Online_Service_PC_Native_Windows_Project.zip" |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "ERROR: Native PC ZIP nahi mila."
            Write-Host "Available ZIP files:"
            Get-ChildItem -Path . -Recurse -Filter "*.zip"
            exit 1
          }

          Write-Host "===================================="
          Write-Host "NATIVE PC PROJECT FOUND"
          Write-Host $zip.FullName
          Write-Host "===================================="

          "PC_ZIP=$($zip.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      # 2. Extract project
      - name: Extract Native PC Project
        shell: powershell
        run: |
          if (Test-Path "pc_project") {
            Remove-Item "pc_project" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "pc_project" | Out-Null

          Expand-Archive `
            -Path "$env:PC_ZIP" `
            -DestinationPath "pc_project" `
            -Force

          Write-Host "Native PC project extracted."

      # 3. Show project files
      - name: Inspect Native Project
        shell: powershell
        run: |
          Write-Host "PROJECT FILES:"
          Get-ChildItem "pc_project" -Recurse |
            Select-Object FullName

      # 4. Install Qt / C++ environment
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 5. Install Python processing dependencies
      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF Pillow pyinstaller

      # 6. Find Python engine
      - name: Find Python Engine
        shell: powershell
        run: |
          $py = Get-ChildItem `
            -Path "pc_project" `
            -Recurse `
            -Filter "*.py" |
            Select-Object -First 1

          if ($py) {
            Write-Host "Python engine found:"
            Write-Host $py.FullName

            "PYTHON_FILE=$($py.FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
            Write-Host "No Python file found."
          }

      # 7. Compile C++ native application
      - name: Build Native C++ Application
        shell: powershell
        run: |

          $cpp = Get-ChildItem `
            -Path "pc_project" `
            -Recurse `
            -Filter "*.cpp" |
            Select-Object -First 1

          if (-not $cpp) {
            Write-Host "ERROR: C++ source nahi mila."
            exit 1
          }

          Write-Host "C++ SOURCE:"
          Write-Host $cpp.FullName

          New-Item -ItemType Directory -Path "native_build" `
            -Force | Out-Null

          cl.exe `
            /EHsc `
            /std:c++17 `
            "$($cpp.FullName)" `
            /Fe:"native_build\Muzammil-Online-Service.exe"

          if (-not (Test-Path "native_build\Muzammil-Online-Service.exe")) {
            Write-Host "ERROR: Native EXE nahi bana."
            exit 1
          }

          Write-Host "NATIVE C++ EXE READY."

      # 8. Build Python helper if available
      - name: Build Python Processing Engine
        shell: powershell
        run: |

          if (-not $env:PYTHON_FILE) {
            Write-Host "Python engine not found - skipping."
            exit 0
          }

          python -m py_compile "$env:PYTHON_FILE"

          Write-Host "Python syntax check successful."

      # 9. Verify native application
      - name: Verify Windows Application
        shell: powershell
        run: |

          $exe = "native_build\Muzammil-Online-Service.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: Final EXE missing."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " MUZAMMIL ONLINE SERVICE"
          Write-Host " NATIVE WINDOWS APPLICATION"
          Write-Host "=========================================="
          Write-Host "EXE:"
          Write-Host $file.FullName
          Write-Host "SIZE:"
          Write-Host $file.Length
          Write-Host "=========================================="

      # 10. Install Inno Setup
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      # 11. Find installer script
      - name: Find Installer Script
        shell: powershell
        run: |

          $iss = Get-ChildItem `
            -Path "pc_project" `
            -Recurse `
            -Filter "*.iss" |
            Select-Object -First 1

          if (-not $iss) {
            Write-Host "ERROR: Inno Setup .iss file nahi mila."
            exit 1
          }

          Write-Host "Installer script:"
          Write-Host $iss.FullName

          "ISS_FILE=$($iss.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      # 12. Build proper Windows Setup
      - name: Build Windows Installer
        shell: powershell
        run: |

          New-Item -ItemType Directory `
            -Path "installer_output" `
            -Force | Out-Null

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "$env:ISS_FILE"

          $setup = Get-ChildItem `
            -Path "pc_project" `
            -Recurse `
            -Filter "*Setup*.exe" |
            Select-Object -First 1

          if (-not $setup) {
            Write-Host "ERROR: Setup EXE generate nahi hua."
            exit 1
          }

          Copy-Item `
            $setup.FullName `
            "installer_output\Muzammil-Online-Service-Setup.exe" `
            -Force

      # 13. Upload final installer
      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-Setup
          path: installer_output\Muzammil-Online-Service-Setup.exe
          if-no-files-found: error
