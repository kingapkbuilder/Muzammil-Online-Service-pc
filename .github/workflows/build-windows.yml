name: Build Muzammil Online Service Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-setup:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      # ==============================
      # 1. CHECKOUT
      # ==============================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==============================
      # 2. NODE.JS
      # ==============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==============================
      # 3. FIND PROJECT ZIP
      # ==============================
      - name: Find project ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" `
            -File |
            Select-Object -First 1

          if (-not $zip) {
            throw "Project ZIP file was not found."
          }

          Write-Host "ZIP found:"
          Write-Host $zip.FullName

          "PROJECT_ZIP=$($zip.FullName)" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==============================
      # 4. EXTRACT ZIP
      # ==============================
      - name: Extract project ZIP
        shell: pwsh
        run: |
          $extract = Join-Path `
            $env:GITHUB_WORKSPACE `
            "_project"

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract |
            Out-Null

          Write-Host "Extracting project..."

          Expand-Archive `
            -Path $env:PROJECT_ZIP `
            -DestinationPath $extract `
            -Force

          Write-Host "ZIP extraction completed."


      # ==============================
      # 5. FIND package.json
      # ==============================
      - name: Find Node project
        shell: pwsh
        run: |

          $package = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\_project" `
            -Recurse `
            -Filter "package.json" `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\node_modules\\"
            } |
            Select-Object -First 1

          if (-not $package) {

            Write-Host "package.json not found."

            Get-ChildItem `
              -Path "$env:GITHUB_WORKSPACE\_project" `
              -Recurse `
              -File |
              Select-Object -First 200 FullName

            throw "package.json was not found inside the ZIP."
          }

          $projectDir = $package.Directory.FullName

          Write-Host ""
          Write-Host "================================"
          Write-Host "PROJECT FOUND"
          Write-Host "================================"
          Write-Host $projectDir
          Write-Host ""

          "PROJECT_DIR=$projectDir" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==============================
      # 6. VERIFY PROJECT
      # ==============================
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |

          if (-not (Test-Path "package.json")) {
            throw "package.json is missing."
          }

          Write-Host "package.json found."

          Get-Content `
            package.json `
            -Raw


      # ==============================
      # 7. INSTALL DEPENDENCIES
      # ==============================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |

          Write-Host "Installing dependencies..."

          npm install --legacy-peer-deps

          if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
          }

          Write-Host "Dependencies installed successfully."


      # ==============================
      # 8. BUILD APPLICATION
      # ==============================
      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |

          Write-Host "Running application build..."

          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "npm run build failed."
          }

          Write-Host "Application build completed."


      # ==============================
      # 9. BUILD WINDOWS NSIS SETUP
      # ==============================
      - name: Build Windows Setup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |

          Write-Host "Building Windows installer..."

          npx electron-builder --win nsis

          if ($LASTEXITCODE -ne 0) {
            throw "Electron Builder failed."
          }

          Write-Host "Windows installer build completed."


      # ==============================
      # 10. FIND EXE
      # ==============================
      - name: Find Setup EXE
        shell: pwsh
        run: |

          Write-Host "Searching for generated EXE..."

          $exe = Get-ChildItem `
            -Path "${{ env.PROJECT_DIR }}" `
            -Recurse `
            -Filter "*.exe" `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\node_modules\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {

            Write-Host "No EXE found."

            Get-ChildItem `
              -Path "${{ env.PROJECT_DIR }}" `
              -Recurse `
              -File |
              Where-Object {
                $_.FullName -notmatch "\\node_modules\\"
              } |
              Select-Object -First 300 FullName

            throw "Windows Setup EXE was not generated."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "SETUP EXE FOUND"
          Write-Host "================================"
          Write-Host $exe.FullName
          Write-Host ""


      # ==============================
      # 11. CREATE RELEASE FOLDER
      # ==============================
      - name: Prepare release folder
        shell: pwsh
        run: |

          $release = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release"

          if (Test-Path $release) {
            Remove-Item `
              $release `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $release |
            Out-Null


      # ==============================
      # 12. COPY FINAL EXE
      # ==============================
      - name: Copy final Setup EXE
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path "${{ env.PROJECT_DIR }}" `
            -Recurse `
            -Filter "*.exe" `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\node_modules\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "Setup EXE not found."
          }

          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "release\Muzammil-Online-Service-Setup.exe"

          Copy-Item `
            $exe.FullName `
            $destination `
            -Force

          Write-Host ""
          Write-Host "================================"
          Write-Host "FINAL SETUP CREATED"
          Write-Host "================================"
          Write-Host $destination
          Write-Host ""


      # ==============================
      # 13. UPLOAD EXE
      # ==============================
      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-PC-Setup
          path: release/Muzammil-Online-Service-Setup.exe
          if-no-files-found: error
          retention-days: 90
