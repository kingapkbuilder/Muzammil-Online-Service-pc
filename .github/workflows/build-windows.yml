name: Build Windows Desktop EXE Setup

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP & Prepare Workspace
        run: |
          # Auto-extract any ZIP file uploaded by user
          $zips = Get-ChildItem -Path . -Filter "*.zip" -File
          foreach ($z in $zips) {
            Write-Host "Auto-extracting: $($z.Name)..."
            Expand-Archive -Path $z.FullName -DestinationPath . -Force
          }

          # If extracted into a subfolder, bring everything to root
          Get-ChildItem -Directory | ForEach-Object {
            if (Test-Path "$($_.FullName)\package.json") {
              Write-Host "Syncing subfolder contents to root..."
              Copy-Item -Path "$($_.FullName)\*" -Destination . -Recurse -Force
            }
          }

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev electron electron-packager --legacy-peer-deps

      - name: Build Web Application Assets
        run: |
          npm run build

      - name: Package Windows .EXE Application
        run: |
          npx electron-packager . "Muzammil Online service pc" --platform=win32 --arch=x64 --out=dist-exe --overwrite --prune=true

      - name: Compress Executable Folder to ZIP
        run: |
          Compress-Archive -Path "dist-exe\Muzammil Online service pc-win32-x64\*" -DestinationPath "Muzammil-Online-Service-Windows-x64.zip"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-x64
          path: Muzammil-Online-Service-Windows-x64.zip
          retention-days: 30
