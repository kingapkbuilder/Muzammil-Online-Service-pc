name: Build Muzammil Online Service Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP MSVC
      # =========================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1


      # =========================================================
      # 3. CHECK PROJECT
      # =========================================================
      - name: Check Native Project
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host " MUZZAMMIL ONLINE SERVICE"
          Write-Host " NATIVE WINDOWS BUILD"
          Write-Host "========================================="

          if (-not (Test-Path "src\main.cpp")) {
            Write-Host "ERROR: src\main.cpp not found."
            Get-ChildItem -Recurse
            exit 1
          }

          if (-not (Test-Path "python\pdf_to_jpg.py")) {
            Write-Host "ERROR: python\pdf_to_jpg.py not found."
            exit 1
          }

          if (-not (Test-Path "installer\MuzammilOnlineService.iss")) {
            Write-Host "ERROR: Inno Setup script not found."
            exit 1
          }

          Write-Host "Project structure OK."


      # =========================================================
      # 4. CLEAN BUILD FOLDER
      # =========================================================
      - name: Clean Build
        shell: powershell
        run: |

          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          if (Test-Path "installer\installer_output") {
            Remove-Item "installer\installer_output" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "build" -Force | Out-Null

          Write-Host "Build folders cleaned."


      # =========================================================
      # 5. BUILD NATIVE C++ APPLICATION
      # =========================================================
      - name: Build Native C++ Application
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host " BUILDING NATIVE C++ APPLICATION"
          Write-Host "========================================="

          cl.exe `
            /nologo `
            /std:c++17 `
            /O2 `
            /EHsc `
            /DUNICODE `
            /D_UNICODE `
            "src\main.cpp" `
            /Fe:"build\Muzammil Online Service.exe" `
            /link `
            /SUBSYSTEM:WINDOWS `
            user32.lib `
            gdi32.lib `
            shell32.lib `
            comdlg32.lib

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "ERROR: C++ build failed."
            exit 1
          }

          if (-not (Test-Path "build\Muzammil Online Service.exe")) {
            Write-Host "ERROR: Native EXE not generated."
            exit 1
          }

          $exe = Get-Item "build\Muzammil Online Service.exe"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " NATIVE C++ EXE READY"
          Write-Host "========================================="
          Write-Host "Name : $($exe.Name)"
          Write-Host "Size : $($exe.Length) bytes"
          Write-Host "Path : $($exe.FullName)"
          Write-Host "========================================="


      # =========================================================
      # 6. SETUP PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================================================
      # 7. INSTALL PYTHON DEPENDENCIES
      # =========================================================
      - name: Install Python Dependencies
        shell: powershell
        run: |

          python --version

          python -m pip install --upgrade pip

          pip install PyMuPDF
          pip install pyinstaller

          Write-Host "Python dependencies installed."


      # =========================================================
      # 8. CHECK PYTHON
      # =========================================================
      - name: Check Python Engine
        shell: powershell
        run: |

          python -m py_compile "python\pdf_to_jpg.py"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Python syntax check failed."
            exit 1
          }

          Write-Host "Python engine syntax OK."


      # =========================================================
      # 9. BUILD PYTHON PDF ENGINE
      # =========================================================
      - name: Build PDF JPG Engine
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host " BUILDING PDF TO JPG ENGINE"
          Write-Host "========================================="

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name "pdf_to_jpg" `
            "python\pdf_to_jpg.py"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: PyInstaller failed."
            exit 1
          }

          if (-not (Test-Path "dist\pdf_to_jpg.exe")) {
            Write-Host "ERROR: pdf_to_jpg.exe not generated."
            exit 1
          }

          Copy-Item `
            "dist\pdf_to_jpg.exe" `
            "build\pdf_to_jpg.exe" `
            -Force

          Write-Host "Python processing EXE ready."


      # =========================================================
      # 10. SHOW BUILD CONTENT
      # =========================================================
      - name: Verify Build Files
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host " BUILD CONTENT"
          Write-Host "========================================="

          Get-ChildItem "build" |
            Select-Object Name,Length,FullName |
            Format-Table -AutoSize

          if (-not (Test-Path "build\Muzammil Online Service.exe")) {
            Write-Host "ERROR: Main EXE missing."
            exit 1
          }

          if (-not (Test-Path "build\pdf_to_jpg.exe")) {
            Write-Host "ERROR: PDF engine missing."
            exit 1
          }


      # =========================================================
      # 11. INSTALL INNO SETUP
      # =========================================================
      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --no-progress `
            -y

          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "ERROR: Inno Setup compiler not found."
            exit 1
          }

          Write-Host "Inno Setup installed."


      # =========================================================
      # 12. BUILD WINDOWS INSTALLER
      # =========================================================
      - name: Build Windows Installer
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host " BUILDING WINDOWS SETUP"
          Write-Host "========================================="

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\MuzammilOnlineService.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Inno Setup failed."
            exit 1
          }


      # =========================================================
      # 13. VERIFY SETUP
      # =========================================================
      - name: Verify Windows Setup
        shell: powershell
        run: |

          $setup = Get-ChildItem `
            "installer\installer_output" `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $setup) {
            Write-Host "ERROR: Windows Setup EXE not generated."
            Write-Host "Installer output:"
            Get-ChildItem "installer" -Recurse
            exit 1
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " MUZZAMMIL ONLINE SERVICE"
          Write-Host " WINDOWS INSTALLER READY"
          Write-Host "=============================================="
          Write-Host "Setup Name:"
          Write-Host $setup.Name
          Write-Host ""
          Write-Host "Setup Size:"
          Write-Host "$($setup.Length) bytes"
          Write-Host ""
          Write-Host "Setup Path:"
          Write-Host $setup.FullName
          Write-Host "=============================================="


      # =========================================================
      # 14. COPY FINAL SETUP TO ROOT
      # =========================================================
      - name: Prepare Final Setup
        shell: powershell
        run: |

          $setup = Get-ChildItem `
            "installer\installer_output" `
            -Filter "*.exe" |
            Select-Object -First 1

          Copy-Item `
            $setup.FullName `
            "Muzammil-Online-Service-Setup.exe" `
            -Force

          if (-not (Test-Path "Muzammil-Online-Service-Setup.exe")) {
            Write-Host "ERROR: Final setup copy failed."
            exit 1
          }

          Write-Host "Final setup prepared."


      # =========================================================
      # 15. UPLOAD FINAL WINDOWS SETUP
      # =========================================================
      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Windows-Setup
          path: Muzammil-Online-Service-Setup.exe
          if-no-files-found: error


      # =========================================================
      # 16. UPLOAD RAW EXE ALSO
      # =========================================================
      - name: Upload Native EXE
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-Native-EXE
          path: build\Muzammil Online Service.exe
          if-no-files-found: error
